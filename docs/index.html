<!DOCTYPE html>
<html>
  <head>
    <title>Event to ICS Converter</title>
  </head>
  <body>
    <h1>Event to ICS Converter</h1>

    <!-- API Key Input -->
    <label for="apiKey">API Key:</label>
    <input
      type="password"
      id="apiKey"
      placeholder="Enter your OpenAI API Key"
    /><br /><br />

    <!-- Model Selection Dropdown -->
    <label for="modelSelect">Select Model:</label>
    <select id="modelSelect">
      <option value="gpt-4o-mini">gpt-4o-mini</option>
      <option value="gpt-4o">gpt-4o</option></select
    ><br /><br />

    <!-- Pre-processing Option -->
    <input type="checkbox" id="preprocessCheckbox" />
    <label for="preprocessCheckbox">Enable Pre-processing</label><br /><br />

    <!-- Event Text Input -->
    <label for="eventText">Event Text:</label><br />
    <textarea
      id="eventText"
      rows="10"
      cols="50"
      placeholder="Enter event details here..."
    ></textarea
    ><br /><br />

    <!-- Convert Button -->
    <button id="convertButton">Convert to ICS</button><br /><br />

    <!-- Preview Area -->
    <div id="preview"></div>

    <!-- Download Link -->
    <a id="downloadLink" href="#" download="event.ics" style="display: none"
      >Download ICS File</a
    >

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const apiKeyInput = document.getElementById("apiKey");
        const eventTextInput = document.getElementById("eventText");
        const convertButton = document.getElementById("convertButton");
        const previewDiv = document.getElementById("preview");
        const downloadLink = document.getElementById("downloadLink");
        const modelSelect = document.getElementById("modelSelect");
        const preprocessCheckbox =
          document.getElementById("preprocessCheckbox");

        // Load API key and model selection from localStorage
        if (localStorage.getItem("openai_api_key")) {
          apiKeyInput.value = localStorage.getItem("openai_api_key");
        }
        if (localStorage.getItem("selected_model")) {
          modelSelect.value = localStorage.getItem("selected_model");
        }
        if (localStorage.getItem("preprocess_enabled") === "true") {
          preprocessCheckbox.checked = true;
        }

        let eventDataArray = []; // Array to store results from 3 runs

        convertButton.addEventListener("click", async function () {
          const apiKey = apiKeyInput.value.trim();
          let eventText = eventTextInput.value.trim();
          const selectedModel = modelSelect.value;
          const preprocessEnabled = preprocessCheckbox.checked;

          if (!apiKey || !eventText) {
            alert("Please enter both API Key and Event Text.");
            return;
          }

          // Store API key and model selection in localStorage
          localStorage.setItem("openai_api_key", apiKey);
          localStorage.setItem("selected_model", selectedModel);
          localStorage.setItem("preprocess_enabled", preprocessEnabled);

          // Pre-processing Step
          if (preprocessEnabled) {
            try {
              const preprocessResponse = await fetch(
                "https://api.openai.com/v1/chat/completions",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: "Bearer " + apiKey,
                  },
                  body: JSON.stringify({
                    model: selectedModel,
                    messages: [
                      {
                        role: "system",
                        content:
                          "You are an assistant that extracts important information from text about events, and removes any clutter or irrelevant details that might come from copy-paste artifacts.",
                      },
                      { role: "user", content: eventText },
                    ],
                  }),
                },
              );

              if (!preprocessResponse.ok) {
                throw new Error(
                  `HTTP error! status: ${preprocessResponse.status}`,
                );
              }

              const preprocessData = await preprocessResponse.json();
              const preprocessMessage =
                preprocessData.choices[0].message.content.trim();

              // Use the cleaned text for the next step
              eventText = preprocessMessage;
            } catch (error) {
              console.error("Pre-processing Error:", error);
              alert("An error occurred during pre-processing.");
              return;
            }
          }

          eventDataArray = []; // Clear previous results

          // Prepare the API requests
          const apiRequests = [];
          for (let i = 0; i < 3; i++) {
            const apiRequest = fetch(
              "https://api.openai.com/v1/chat/completions",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + apiKey,
                },
                body: JSON.stringify({
                  model: selectedModel,
                  messages: [
                    {
                      role: "system",
                      content:
                        "You are an assistant that extracts event information from text. That is most of the time copy & paste from sources that have unstructured data.",
                    },
                    { role: "user", content: eventText },
                  ],
                  functions: [
                    {
                      name: "extract_event_info",
                      description:
                        "Extracts event information from text and returns it as structured data. Provide only data if the information is present in the text.",
                      parameters: {
                        type: "object",
                        properties: {
                          title: {
                            type: "string",
                            description:
                              "Title of the event. Never include Event in the title. It is redundant. Also the title should be short and descriptive. No need to include the date or time or location in the title.",
                          },
                          start: {
                            type: "string",
                            description:
                              "Event start date and time in YYYYMMDDTHHMMSS format",
                          },
                          end: {
                            type: "string",
                            description:
                              "Event end date and time in YYYYMMDDTHHMMSS format",
                          },
                          place: {
                            type: "string",
                            description:
                              "Location of the event. Name of the location and address.",
                          },
                          url: {
                            type: "string",
                            description: "URL of the event or the location.",
                          },
                          notes: {
                            type: "string",
                            description:
                              "Additional notes about the event or additional information and details. Additional URLs, contact information, etc.",
                          },
                        },
                        required: ["title", "start", "end"],
                      },
                    },
                  ],
                  function_call: { name: "extract_event_info" },
                }),
              },
            )
              .then(async (response) => {
                if (!response.ok) {
                  throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                const message = data.choices[0].message;
                if (message.function_call && message.function_call.arguments) {
                  const functionArgs = JSON.parse(
                    message.function_call.arguments,
                  );
                  return functionArgs;
                } else {
                  console.error("Assistant message:", message);
                  return null;
                }
              })
              .catch((error) => {
                console.error("Error:", error);
                return null;
              });

            apiRequests.push(apiRequest);
          }

          // Run API requests in parallel
          Promise.all(apiRequests).then((results) => {
            // Filter out any null results (due to errors)
            eventDataArray = results.filter((result) => result !== null);

            if (eventDataArray.length > 0) {
              // Create options for each field
              createFieldOptions(eventDataArray);
            } else {
              alert("Failed to extract event information.");
              return;
            }
          });
        });

        function createFieldOptions(eventDataArray) {
          const fields = ["title", "start", "end", "place", "url", "notes"];
          previewDiv.innerHTML = "<h2>Select Event Data</h2>";

          const form = document.createElement("form");
          form.id = "eventDataForm";

          fields.forEach((field) => {
            // Collect all values for this field
            const values = eventDataArray
              .map((eventData) => eventData[field])
              .filter((value) => value !== undefined);

            // Get unique values
            const uniqueValues = [...new Set(values)];

            // If all values are the same, just display the value
            if (uniqueValues.length === 1) {
              const fieldDiv = document.createElement("div");
              fieldDiv.style.marginBottom = "10px";

              const label = document.createElement("label");
              label.textContent =
                field.charAt(0).toUpperCase() + field.slice(1) + ": ";
              fieldDiv.appendChild(label);

              const span = document.createElement("span");
              span.textContent = uniqueValues[0];
              fieldDiv.appendChild(span);

              // Hidden input to store the value
              const hiddenInput = document.createElement("input");
              hiddenInput.type = "hidden";
              hiddenInput.name = field;
              hiddenInput.value = uniqueValues[0];
              fieldDiv.appendChild(hiddenInput);

              form.appendChild(fieldDiv);
            } else if (uniqueValues.length > 1) {
              // Create option fields for the options
              const fieldDiv = document.createElement("div");
              fieldDiv.style.marginBottom = "10px";

              const label = document.createElement("label");
              label.textContent =
                field.charAt(0).toUpperCase() + field.slice(1) + ": ";
              fieldDiv.appendChild(label);

              uniqueValues.forEach((optionValue, index) => {
                const optionDiv = document.createElement("div");

                const radio = document.createElement("input");
                radio.type = "radio";
                radio.name = field;
                radio.value = optionValue;
                if (index === 0) {
                  radio.checked = true; // default to first option
                }

                const radioLabel = document.createElement("label");
                radioLabel.textContent = optionValue;

                optionDiv.appendChild(radio);
                optionDiv.appendChild(radioLabel);
                fieldDiv.appendChild(optionDiv);
              });

              form.appendChild(fieldDiv);
            } else {
              // No values extracted for this field
              const fieldDiv = document.createElement("div");
              fieldDiv.style.marginBottom = "10px";

              const label = document.createElement("label");
              label.textContent =
                field.charAt(0).toUpperCase() + field.slice(1) + ": ";
              fieldDiv.appendChild(label);

              const input = document.createElement("input");
              input.type = "text";
              input.name = field;
              input.placeholder = "(No value)";
              fieldDiv.appendChild(input);

              form.appendChild(fieldDiv);
            }
          });

          // Add a button to generate the ICS file
          const generateButton = document.createElement("button");
          generateButton.type = "button";
          generateButton.textContent = "Generate ICS File";
          generateButton.addEventListener("click", function () {
            const formData = new FormData(form);
            const selectedEventData = {};
            for (const [key, value] of formData.entries()) {
              selectedEventData[key] = value;
            }
            // Generate ICS file with selected data
            const icsContent = generateICS(selectedEventData);

            // Create a Blob and URL for the ICS file
            const blob = new Blob([icsContent], { type: "text/calendar" });
            const url = URL.createObjectURL(blob);

            // Set up the download link
            downloadLink.href = url;
            downloadLink.style.display = "inline";
          });

          form.appendChild(generateButton);
          previewDiv.appendChild(form);
        }

        function generateICS(eventData) {
          const lines = [];
          lines.push("BEGIN:VCALENDAR");
          lines.push("VERSION:2.0");

          // Include timezone information
          const tzid =
            Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";

          lines.push("PRODID:-//Your Organization//Event to ICS Converter//EN");
          lines.push("BEGIN:VEVENT");
          lines.push("UID:" + generateUID());
          lines.push("DTSTAMP:" + formatDateTime(new Date()));

          if (eventData.start) {
            lines.push("DTSTART;TZID=" + tzid + ":" + eventData.start);
          }
          if (eventData.end) {
            lines.push("DTEND;TZID=" + tzid + ":" + eventData.end);
          }
          if (eventData.title) {
            lines.push("SUMMARY:" + escapeICSText(eventData.title));
          }
          if (eventData.place) {
            lines.push("LOCATION:" + escapeICSText(eventData.place));
          }
          if (eventData.url) {
            lines.push("URL:" + escapeICSText(eventData.url));
          }
          if (eventData.notes) {
            lines.push("DESCRIPTION:" + escapeICSText(eventData.notes));
          }
          lines.push("END:VEVENT");
          lines.push("END:VCALENDAR");
          return lines.join("\r\n");
        }

        function generateUID() {
          return "uid" + Date.now() + "@example.com";
        }

        function formatDateTime(date) {
          // Returns date in YYYYMMDDTHHMMSS format
          const pad = (n) => (n < 10 ? "0" + n : n);
          return (
            date.getFullYear().toString() +
            pad(date.getMonth() + 1) +
            pad(date.getDate()) +
            "T" +
            pad(date.getHours()) +
            pad(date.getMinutes()) +
            pad(date.getSeconds())
          );
        }

        function escapeICSText(text) {
          // Escape special characters for ICS format
          return text
            .replace(/\\/g, "\\\\")
            .replace(/;/g, "\\;")
            .replace(/,/g, "\\,")
            .replace(/\n/g, "\\n");
        }
      });
    </script>
  </body>
</html>
